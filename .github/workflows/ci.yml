name: CI

# Sin filtros `paths`: corre en todo PR y en todo push a `main`.
on:
  pull_request:
    # ready_for_review: un draft puesto en listo también reporta Mutation.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; every job inherits this.
permissions:
  contents: read

# Un push nuevo cancela el run anterior de la misma ref; main queda exento.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # El Makefile entra en la clave de caché: ahí vive GOLANGCI_LINT_VERSION.
          cache-dependency-path: |
            go.sum
            Makefile
      # Mismo camino que `make lint` en local: golangci-lint v2.13.2 vía Makefile.
      - name: Lint
        run: make lint

  Test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historia completa: el gate de cobertura usa `git merge-base <base> HEAD`.
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # fd como dependencia cacheada: binario de las releases, versión dentro de la clave.
      - name: Cache fd
        id: fd-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/fd-bin
          key: fd-v10.5.0-x86_64-unknown-linux-gnu
      - name: Install fd
        if: steps.fd-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/fd-bin"
          curl -fsSL "https://github.com/sharkdp/fd/releases/download/v10.5.0/fd-v10.5.0-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/fd-bin" --strip-components=1
      - name: Put fd on PATH
        run: echo "$HOME/fd-bin" >> "$GITHUB_PATH"
      # Misma suite que `make test` (sin `-short`), perfil de cobertura atómico y `-count=1`.
      # internal/app levanta PostgreSQL con testcontainers desde el Docker del runner.
      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "coverage.out not produced (tests failed before it was written)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total=$(go tool cover -func=coverage.out | tail -n1 | awk '{print $3}')
          {
            echo "## Test coverage"
            echo ""
            echo "**Total: ${total}**"
            echo ""
            echo "| Package | Coverage |"
            echo "| --- | --- |"
            awk 'NR > 1 {
              split($1, a, ":"); f = a[1];
              n = split(f, p, "/"); pkg = "";
              for (i = 1; i < n; i++) pkg = pkg (i > 1 ? "/" : "") p[i];
              tot[pkg] += $2;
              if ($3 + 0 > 0) cov[pkg] += $2;
            }
            END {
              for (k in tot) printf "| %s | %.1f%% |\n", k, (tot[k] > 0 ? 100 * cov[k] / tot[k] : 0);
            }' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"

      # 100% de las líneas tocadas contra el merge-base, total contra scripts/coverage-floor.
      - name: Coverage gate
        run: |
          set -euo pipefail
          if [ ! -f coverage.out ]; then
            echo "::error::no coverage.out (the tests did not produce it)"
            exit 1
          fi
          base="origin/${{ github.event.pull_request.base.ref || 'main' }}"
          if ! git rev-parse --verify --quiet "$base" >/dev/null; then
            base="${{ github.event.pull_request.base.ref || 'main' }}"
          fi
          merge_base="$(git merge-base "$base" HEAD)"
          if [ -z "$merge_base" ]; then
            echo "::error::no merge-base between HEAD and $base"
            exit 1
          fi
          echo "diff against the merge-base $merge_base ($base)"
          scripts/diff-coverage.sh coverage.out "$merge_base" \
            | tee -a "$GITHUB_STEP_SUMMARY"

# -- Mutation ---------------------------------------------------------
# Mide y decide `scripts/mutate.sh`; este archivo aporta paths, refs y presupuesto.
# Sin `needs:` ni `continue-on-error`; el único `if:` es de evento (no draft).

  Mutation:
    # Solo en PR no draft; el fail-vs-skip vive en scripts/mutate.sh.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    name: Mutation
    runs-on: ubuntu-24.04
    # 13m de techo + 360s de reserva < 20m de job; la cadena la valida mutate.sh.
    timeout-minutes: 20
    env:
      # Base = merge-base de la rama contra la que se abre el PR.
      MUTATE_BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
      # Presupuesto obligatorio con --ci: mutate.sh se niega a arrancar sin él.
      MUTATE_CAP: 180s
      MUTATE_WORKERS: 4
      MUTATE_STALL: 8m
      MUTATE_CEILING: 13m
      MUTATE_JOB_CEILING: 20m
      MUTATE_SETUP_RESERVE: 360s
    steps:
      # El reloj arranca antes del checkout: la reserva se mide desde aquí.
      - name: Mark the job clock
        run: echo "MUTATE_JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Historia completa: el alcance se calcula con `git diff <base>...HEAD`.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # scripts/mutate.sh entra en la clave de caché.
          cache-dependency-path: |
            go.sum
            scripts/mutate.sh

      # Los dos suites del gate: mutate_test.sh y watchdog_test.sh (~1s).
      - name: Shell suites
        run: |
          set -euo pipefail
          bash scripts/watchdog_test.sh
          bash scripts/mutate_test.sh

      # Exige `.mutation-allowlist`: sin él no hay con qué comparar supervivientes.
      - name: Calibration
        run: |
          set -euo pipefail
          if [ ! -f .mutation-allowlist ]; then
            echo "::error title=Mutation testing not calibrated::.mutation-allowlist is missing, so the gate cannot run and no surviving mutant is being detected. Seed it with: make mutate, then commit .mutation-allowlist"
            exit 1
          fi
          echo "calibrated: $(grep -cvE '^[[:space:]]*(#|$)' .mutation-allowlist) allowlisted mutants"

      # Trae la ref base aunque el clone sea somero.
      - name: Resolve mutation scope
        run: |
          set -euo pipefail
          echo "base=$MUTATE_BASE"
          git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref || github.event.repository.default_branch }}:refs/remotes/origin/${{ github.base_ref || github.event.repository.default_branch }}" || \
            echo "could not fetch base ref; continuing with what is present"

      # Un paso que mide y decide: el código de salida es el veredicto.
      - name: Mutate and gate
        id: mutate
        run: scripts/mutate.sh --diff --ci --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ github.event.pull_request.number || github.run_id }}
          # El reporte y el run log del paso anterior.
          path: |
            ${{ steps.mutate.outputs.report }}
            ${{ steps.mutate.outputs.run_log }}
          if-no-files-found: ignore
          retention-days: 14
