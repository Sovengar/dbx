name: CI

# NOTE: this workflow intentionally has NO `paths` / `paths-ignore` filters.
# A path-filtered push/PR skips the workflow entirely; a skipped workflow leaves
# its required status checks stuck in "pending" forever, which deadlocks every
# PR that does not touch the filtered paths. The gates run on every change.
on:
  pull_request:
    # ready_for_review is NOT in the default set (opened, synchronize, reopened), so a
    # draft flipped to ready would report no mutation check at all -- and it is required.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; every job inherits this.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled so a new push ends the previous
# check run. Main is exempt: every commit landing on main gets a complete run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  Lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Makefile is part of the cache key: GOLANGCI_LINT_VERSION lives there,
          # so bumping the linter busts the cached modules instead of reusing stale ones.
          cache-dependency-path: |
            go.sum
            Makefile
      # Exact `make lint` parity: same pinned golangci-lint v2.13.2 as local,
      # invoked through the repo Makefile (no .golangci.yml exists -> default linter set).
      - name: Lint
        run: make lint

  Test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      # `go build ./...` used to be a step here and is GONE: redundant three ways --
      # `go test ./...` compiles every package (that is what "[no test files]" means),
      # golangci-lint type-checks, and `go build -x ./...` never invokes the linker. It
      # was also on the critical path, costing 14 s in the job whose point is the suite.
      # Same test set as `make test` (`go test -race`, no `-short`, so the
      # integration tests run) plus an atomic coverage profile, with `-count=1`
      # so a cached PASS can never stand in for a real run. The integration tests
      # in internal/app start PostgreSQL through testcontainers, which uses the
      # Docker daemon the ubuntu-24.04 runner ships with; the package-level
      # testdb_test.go handles provisioning, so no `services:` block is needed.
      # (internal/config's scanner tests use a discovery seam, so `fd` is not
      # required on the runner — unlike the documented local environment.)
      - name: Test
        run: go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "coverage.out not produced (tests failed before it was written)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          total=$(go tool cover -func=coverage.out | tail -n1 | awk '{print $3}')
          {
            echo "## Test coverage"
            echo ""
            echo "**Total: ${total}**"
            echo ""
            echo "| Package | Coverage |"
            echo "| --- | --- |"
            awk 'NR > 1 {
              split($1, a, ":"); f = a[1];
              n = split(f, p, "/"); pkg = "";
              for (i = 1; i < n; i++) pkg = pkg (i > 1 ? "/" : "") p[i];
              tot[pkg] += $2;
              if ($3 + 0 > 0) cov[pkg] += $2;
            }
            END {
              for (k in tot) printf "| %s | %.1f%% |\n", k, (tot[k] > 0 ? 100 * cov[k] / tot[k] : 0);
            }' coverage.out | sort
          } >> "$GITHUB_STEP_SUMMARY"

# -- de mutation.yml, trasladados aqui ------------------------------------
# Este bloque era la cabecera del workflow `Mutation`, ahora job de ci.yml.
# Las referencias a "workflow" y a los tres jobs de antes siguen siendo
# Mutation testing via gremlins, with a blocking gate on new surviving mutants.
# Deliberately has NO `paths` filters: a path-filtered workflow that ever becomes a
# required check leaves that check stuck in "pending" on every PR that skips it,
# which deadlocks those PRs. The .go scope is enforced INSIDE the job instead,
# mirroring the guard in `make mutate-diff`.
# Because there are no path filters, this workflow is SAFE to mark as a required
# status check; do that in branch protection if you want the gate to block merges.
# The Mutation job is gated on a Calibration job: in a repo without
# .mutation-allowlist the Mutation job is SKIPPED (visibly not-a-pass) instead of
# reporting green while measuring nothing. Consequence: a skipped job is a skipped
# check, so `Mutation` must NOT be marked as a required status check in branch
# protection - same deadlock class as path filters.

# -- Mutation ---------------------------------------------------------
# Moved here from mutation.yml: mutation is a CI verdict, not a separate product.
# The gate is unchanged (Calibration still decides fail-vs-skip).
  Calibration:
    # Mutation only once the PR is up for review: a draft pays for nothing.
    # It cannot be ONLY the ready_for_review transition -- any later push
    # would leave the required check unreported on the new head, i.e. a
    # permanent block. So: whenever the PR is not a draft.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    name: Mutation calibration
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      calibrated: ${{ steps.check.outputs.calibrated }}
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      # The scope regexp is an EXCLUSION list, so a file is gated only when
      # nothing in it matches. That is easy to get wrong in either direction:
      # a file that should be gated but is not is a silent hole, and one that
      # should be out but is in turns the gate into a check that rarely fails.
      # This also fails on any new Go file nobody classified, which is how the
      # scope rots.
      - name: Check mutation scope
        id: scope
        run: |
          if python3 scripts/check_mutate_scope.py; then
            echo "scope=ok" >> "$GITHUB_OUTPUT"
          else
            echo "scope=bad" >> "$GITHUB_OUTPUT"
            echo "::error title=Mutation scope mismatch::MUTATE_EXCLUDE and scripts/check_mutate_scope.py disagree. Add any new Go file to EXPECTED and flip it deliberately."
          fi

      - name: Check calibration
        id: check
        run: |
          if [ -f .mutation-allowlist ]; then
            echo "calibrated=true" >> "$GITHUB_OUTPUT"
            echo "calibrated: .mutation-allowlist present"
          else
            echo "calibrated=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Mutation testing not calibrated::.mutation-allowlist is missing, so the gate cannot run and no surviving mutant is being detected. Seed it with: make mutate, then commit .mutation-allowlist"
          fi

  Mutation:
    name: Mutation
    needs: Calibration
    # A scope mismatch is a real failure, not a warning: either direction of the
    # error defeats the purpose of the gate, so nothing downstream can be trusted.
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft &&
        needs.Calibration.outputs.calibrated == 'true' && needs.Calibration.outputs.scope == 'ok'
    runs-on: ubuntu-24.04
    # Hard cap. gremlins is never signalled: on SIGTERM it panics
    # ("send on closed channel") and writes no report.json, so a timeout can only
    # mean "no result", never a wrong one.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the PR base ref exists for `git diff <base>...HEAD`
          # and for `gremlins --diff <base>`.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # Makefile is part of the cache key: MUTATE_BASE and the tool wiring live
          # there, so changing them busts stale module caches.
          cache-dependency-path: |
            go.sum
            Makefile

      - name: Resolve mutation scope
        id: scope
        env:
          BASE: origin/${{ github.base_ref || github.event.repository.default_branch }}
          BASE_BRANCH: ${{ github.base_ref || github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          echo "base=$BASE"
          # Belt and braces: guarantee the base ref is fetched even on shallow setups.
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH" || \
            echo "could not fetch base ref $BASE_BRANCH; continuing with what is present"
          if git diff --name-only "$BASE...HEAD" | grep -q '\.go$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            git diff --name-only "$BASE...HEAD" | grep '\.go$' | sed 's/^/  changed: /'
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "no .go changes vs $BASE - nothing to mutate"
          fi

      - name: Mutate
        if: steps.scope.outputs.run == 'true'
        # A gremlins crash must not be read as a mutation failure: the Gate step
        # below decides, and it treats a missing report.json as "no result".
        continue-on-error: true
        run: make mutate-diff MUTATE_BASE=origin/${{ github.base_ref || github.event.repository.default_branch }}

      # Blocking gate: fail on any surviving mutant in the diff that is not already
      # listed in .mutation-allowlist.
      - name: Gate
        if: always() && steps.scope.outputs.run == 'true'
        env:
          ALLOWLIST: .mutation-allowlist
        run: |
          set -uo pipefail
          S="$GITHUB_STEP_SUMMARY"
          : > "$S"
          echo "### Mutation testing" >> "$S"

          if [ ! -f report.json ]; then
            echo "- no report.json (timed out, or gremlins crashed) -> no result, gate passes" >> "$S"
            exit 0
          fi

          echo "- total: $(jq -r '.mutants_total' report.json)" >> "$S"
          echo "- killed: $(jq -r '.mutants_killed' report.json)" >> "$S"
          echo "- survived: $(jq -r '.mutants_lived' report.json)" >> "$S"
          echo "- not covered: $(jq -r '.mutants_not_covered' report.json)" >> "$S"
          echo "- test efficacy: $(jq -r '.test_efficacy' report.json)%" >> "$S"
          echo "- mutator coverage: $(jq -r '.mutations_coverage' report.json)%" >> "$S"
          echo "- note: gremlins does not report TIMED OUT mutants in report.json, and efficacy excludes them" >> "$S"

          jq -r '.files[] | .file_name as $f | .mutations[] | select(.status=="LIVED") | "\(.type) \($f):\(.line)"' report.json | sort -u > /tmp/lived.txt
          total=$(wc -l < /tmp/lived.txt)

          if [ ! -f "$ALLOWLIST" ]; then
            echo "- surviving in diff: $total" >> "$S"
            echo "- gate NOT calibrated: $ALLOWLIST is missing, so this run reports only and cannot block" >> "$S"
            exit 0
          fi

          grep -vE '^[[:space:]]*(#|$)' "$ALLOWLIST" | sed 's/[[:space:]]*$//' | sort -u > /tmp/allow.txt
          comm -23 /tmp/lived.txt /tmp/allow.txt > /tmp/new_lived.txt
          new=$(wc -l < /tmp/new_lived.txt)

          echo "- surviving in diff: $total (allowlisted: $((total - new)), new: $new)" >> "$S"

          if [ "$new" -gt 0 ]; then
            {
              echo ""
              echo "New surviving mutants - no test catches these changes:"
              sed 's/^/- /' /tmp/new_lived.txt
              echo ""
              echo "Add a test that kills them, or - only if provably equivalent - add the line to $ALLOWLIST with a comment saying why."
            } >> "$S"
            exit 1
          fi

      - name: Check unevaluated mutants against .mutation-notcovered
        # A NOT COVERED or TIMED OUT mutant is one the tool chose not to run, so
        # it is invisible to the check above: it is not a survivor, and it is not
        # a kill either. Failing only on survivors therefore lets an untested
        # branch sit in the gate forever with nothing but a number in the summary.
        # A TIMED OUT mutant is worse, because it is absent from the counted
        # totals and so makes the efficacy figure go UP.
        run: |
          set -uo pipefail
          if ! python3 scripts/check_mutate_nc.py; then
            {
              echo ""
              echo "Uncovered mutants - these were never run, so nothing is known about them."
              echo "Add a test that covers the branch, or - only if it is unreachable or dead -"
              echo "add the entry to .mutation-notcovered with the reason."
            } >> "$S"
            exit 1
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-report-${{ github.event.pull_request.number || github.run_id }}
          path: report.json
          if-no-files-found: ignore
          retention-days: 14
